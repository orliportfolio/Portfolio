  c.frameEl = s.querySelector('.frame');
  c.chipEl = s.querySelector('.chip.t');
  /* a tap that closed the viewer re-fires as a click on whatever is underneath; ignore it */
  s.querySelector('.hit').addEventListener('click', function () {
    if (open_ || Date.now() - closedAt < 700) return;
    openAt(i, 0);
  });
  feed.appendChild(s);
});

/* ---------- contact ---------- */
var LINKS = [
  { label: 'email', href: 'mailto:orlirein8@gmail.com' },
  { label: 'linkedin', href: 'https://www.linkedin.com/in/orlirein' },
  { label: 'resume', href: 'Resume.html' }
];
var contact = el('section', 'sec sheet');
contact.innerHTML =
  '<div><div class="mono kicker">creative producer / editorial strategist / content creator</div>' +
  '<h2 class="disp ctitle">contact<br>me</h2></div>' +
  '<div><div>' + LINKS.map(function (l) {
    return '<a class="row" href="' + l.href + '"' + (/^https?:/.test(l.href) ? ' target="_blank" rel="noopener"' : '') + '><span class="disp">' + l.label + '</span>' +
      '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11l6-6"></path><path d="M5.5 5H11v5.5"></path></svg></a>';
  }).join('') + '</div>' +
  '<button type="button" class="top mono" id="toTop"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l5-5 5 5"></path></svg>back to top</button>' +
  '<div class="mono meta"><span>© orli rein 2026</span><span>new york city</span></div></div>';
feed.appendChild(contact);

document.getElementById('toContact').addEventListener('click', function () {
  feed.scrollTo({ top: (CAMPS.length + 1) * H(), behavior: 'smooth' });
});
document.getElementById('toTop').addEventListener('click', function () {
  feed.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ---------- feed video ---------- */
var feedIdx = 0, feedVid = null, feedCi = -1;

function clearFeedVid() {
  if (feedVid) { try { feedVid.pause(); feedVid.removeAttribute('src'); feedVid.load(); } catch (e) {} feedVid.remove(); feedVid = null; }
  if (feedCi >= 0 && CAMPS[feedCi] && CAMPS[feedCi].chipEl) CAMPS[feedCi].chipEl.hidden = true;
  feedCi = -1;
}

function activate(ci) {
  if (ci === feedCi) return;
  clearFeedVid();
  var c = CAMPS[ci];
  if (!c || !c.firstIsVideo || open_) return;
  feedCi = ci;
  var vd = document.createElement('video');
  vd.src = c.items[0].src;
  vd.muted = true; vd.loop = true; vd.playsInline = true;
  vd.setAttribute('playsinline', ''); vd.setAttribute('muted', '');
  vd.preload = 'auto';
  vd.addEventListener('canplay', function () { var p = vd.play(); if (p && p.catch) p.catch(function () {}); });
  vd.addEventListener('timeupdate', function () {
    if (!vd.duration || !c.chipEl) return;
    c.chipEl.hidden = false;
    c.chipEl.textContent = fmt(vd.duration - vd.currentTime);
  });
  c.frameEl.appendChild(vd);
  feedVid = vd;
}

var sTo;
feed.addEventListener('scroll', function () {
  var i = Math.round(feed.scrollTop / H());
  if (i === feedIdx) return;
  feedIdx = i;
  clearTimeout(sTo);
  sTo = setTimeout(function () { activate(feedIdx - 1); }, 120);
}, { passive: true });

/* ---------- viewer ---------- */
var viewer = document.getElementById('viewer');
var vMedia = document.getElementById('vMedia'), iMedia = document.getElementById('iMedia');
var vSegs = document.getElementById('vSegs'), vChip = document.getElementById('vChip');
var vStk = document.getElementById('vStk'), vClient = document.getElementById('vClient'), vTitle = document.getElementById('vTitle');
var vSound = document.getElementById('vSound'), vClose = document.getElementById('vClose');
var open_ = false, ci = 0, ii = 0, prog = 0, muted = false, timer = null, closedAt = 0;

function cur() { return CAMPS[ci].items[ii]; }

function paintSegs() {
  var items = CAMPS[ci].items;
  if (vSegs.children.length !== items.length) {
    vSegs.innerHTML = items.map(function () { return '<div class="seg"><i></i></div>'; }).join('');
  }
  for (var k = 0; k < items.length; k++) {
    vSegs.children[k].firstChild.style.width = k < ii ? '100%' : k === ii ? (prog * 100).toFixed(1) + '%' : '0%';
  }
}

function render() {
  var c = CAMPS[ci], it = cur();
  viewer.style.background = grad(it.key);
  viewer.setAttribute('aria-label', c.title);
  vStk.src = c.sticker; vClient.textContent = c.client; vTitle.textContent = c.title;
  vSound.hidden = !it.audio;
  vSound.innerHTML = (muted ? MUTE : LOUD).replace(/%S%/g, '22');
  vSound.setAttribute('aria-label', muted ? 'turn sound on' : 'turn sound off');
  vChip.hidden = true;

  if (it.video) {
    iMedia.hidden = true; iMedia.removeAttribute('src');
    vMedia.hidden = false;
    if (vMedia.getAttribute('src') !== it.src) { vMedia.setAttribute('src', it.src); vMedia.load(); }
    vMedia.muted = it.audio ? muted : true;
    vMedia.loop = false;
    var p = vMedia.play();
    if (p && p.catch) p.catch(function () { vMedia.muted = true; muted = true; vSound.innerHTML = MUTE.replace(/%S%/g, '22'); vMedia.play(); });
  } else {
    try { vMedia.pause(); } catch (e) {}
    vMedia.hidden = true; vMedia.removeAttribute('src');
    iMedia.hidden = false; iMedia.src = it.src; iMedia.alt = c.alt;
  }
  paintSegs();
}

vMedia.addEventListener('timeupdate', function () {
  if (!vMedia.duration) return;
  prog = Math.min(1, vMedia.currentTime / vMedia.duration);
  vChip.hidden = false;
  vChip.textContent = fmt(vMedia.duration - vMedia.currentTime);
  paintSegs();
});
vMedia.addEventListener('ended', function () { nextItem(); });

function openAt(c0, i0) {
  clearFeedVid();
  open_ = true; ci = c0; ii = i0; prog = 0; muted = false;
  viewer.hidden = false;
  document.body.style.overscrollBehavior = 'none';
  render();
  if (!timer) timer = setInterval(tick, 50);
}

function closeViewer(advance) {
  open_ = false;
  closedAt = Date.now();
  viewer.hidden = true;
  clearInterval(timer); timer = null;
  try { vMedia.pause(); } catch (e) {}
  vMedia.removeAttribute('src');
  feedIdx = ci + 1;
  feed.scrollTop = (ci + 1) * H();
  if (advance) setTimeout(function () { feed.scrollTo({ top: (ci + 2) * H(), behavior: 'smooth' }); }, 140);
  setTimeout(function () { activate(Math.round(feed.scrollTop / H()) - 1); }, advance ? 700 : 160);
}

function tick() {
  if (!open_) return;
  var it = cur();
  if (!it || it.video) return;
  prog += 0.01;
  if (prog >= 1) nextItem(); else paintSegs();
}

function nextItem() {
  if (ii < CAMPS[ci].items.length - 1) { ii++; prog = 0; render(); }
  else closeViewer(true);
}
function prevItem() {
  if (ii > 0) { ii--; prog = 0; render(); }
  else { prog = 0; if (!cur().video) paintSegs(); else { try { vMedia.currentTime = 0; } catch (e) {} } }
}
function nextCampaign() { if (ci < CAMPS.length - 1) { ci++; ii = 0; prog = 0; render(); } }
function prevCampaign() { if (ci > 0) { ci--; ii = 0; prog = 0; render(); } }

vSound.addEventListener('click', function (e) {
  e.stopPropagation();
  muted = !muted;
  vMedia.muted = muted;
  vSound.innerHTML = (muted ? MUTE : LOUD).replace(/%S%/g, '22');
  vSound.setAttribute('aria-label', muted ? 'turn sound on' : 'turn sound off');
});
vClose.addEventListener('click', function (e) { e.stopPropagation(); closeViewer(false); });

var g = null;
viewer.addEventListener('pointerdown', function (e) { g = { x: e.clientX, y: e.clientY }; });
viewer.addEventListener('pointercancel', function () { g = null; });
viewer.addEventListener('pointerup', function (e) {
  var s = g; g = null;
  if (!s) return;
  if (e.target.closest && e.target.closest('.ic')) return;
  var r = viewer.getBoundingClientRect();
  var dx = e.clientX - s.x, dy = e.clientY - s.y;
  if (dy > 70 && Math.abs(dy) > Math.abs(dx)) { closeViewer(false); return; }
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) nextCampaign(); else prevCampaign(); return; }
  if (Math.abs(dx) < 14 && Math.abs(dy) < 14) {
    var rel = (e.clientX - r.left) / r.width;
    if (rel < 0.3) prevItem(); else nextItem();
  }
});

document.addEventListener('keydown', function (e) {
  if (!open_) return;
  if (e.key === 'Escape') closeViewer(false);
  else if (e.key === 'ArrowRight') nextItem();
  else if (e.key === 'ArrowLeft') prevItem();
});

/* re-fit whenever the viewport changes shape: rotation, browser chrome, fonts landing */
sizeFrames();
window.addEventListener('resize', function () { setVh(false); });
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(queueSize).catch(function () {}); }
window.addEventListener('orientationchange', function () {
  setTimeout(function () { setVh(true); feed.scrollTop = feedIdx * H(); }, 250);
});
activate(0);
})();
</script>
